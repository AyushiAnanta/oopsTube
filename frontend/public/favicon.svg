<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="20" fill="#13111c" />
  <circle cx="15" cy="15" r="30" fill="#4c1d95" opacity="0.8" filter="url(#glow)" />
  <circle cx="85" cy="85" r="35" fill="#4c1d95" opacity="0.8" filter="url(#glow)" />
  <rect x="15" y="30" width="70" height="40" rx="12" fill="#8b5cf6" />
  <polygon points="42,40 42,60 62,50" fill="#ffffff" />
</svg>
